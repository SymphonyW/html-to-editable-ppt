<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background: #111827; }
    .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #f8fafc; }
    h1 { position: absolute; left: 90px; top: 80px; margin: 0; font-size: 54px; color: #111827; }
    .subtitle { position: absolute; left: 94px; top: 160px; font-size: 26px; color: #475569; }
    .card { position: absolute; left: 90px; top: 260px; width: 500px; height: 230px; background: #ffffff; border: 2px solid #cbd5e1; border-radius: 24px; }
    .card p { margin: 36px; font-size: 30px; line-height: 1.4; color: #0f172a; }
  </style>
</head>
<body>
  <section class="slide">
    <h1>HTML → Editable PPT</h1>
    <div class="subtitle">Native text, shapes and media remain editable.</div>
    <div class="card"><p>This card becomes a PowerPoint shape and this paragraph becomes a native text box.</p></div>
  </section>
</body>
</html>
